name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Install system dependencies
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libssl-dev \
          pkg-config \
          build-essential \
          curl \
          wget \
          file

    # Set up Rust
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: x86_64-unknown-linux-gnu

    # Use rust-cache for Cargo dependencies
    - name: Set up Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: linux
        cache-on-failure: true

    # Cache Tauri CLI binary
    - name: Cache Tauri CLI
      id: cache-tauri-cli
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-tauri
        key: linux-tauri-cli-2.0-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          linux-tauri-cli-2.0-

    # Install Tauri CLI
    - name: Install cargo-tauri
      if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
      run: cargo install tauri-cli --version "^2.0.0" --locked

    # Run tests
    - name: Run tests
      run: cargo test --workspace

    # Run clippy
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Build the app
    - name: Build app
      run: cargo build --release

    # Bundle the application
    - name: Bundle application
      run: cargo tauri build

    # Upload Debian package
    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: skybal-linux-deb
        path: target/release/bundle/deb/*.deb
        if-no-files-found: error

    # Upload AppImage (if exists)
    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      if: hashFiles('target/release/bundle/appimage/*.AppImage') != ''
      with:
        name: skybal-linux-appimage
        path: target/release/bundle/appimage/*.AppImage

    # Print build info
    - name: Print build summary
      run: |
        echo "✅ Linux build completed successfully"
        echo "📦 Debian packages:"
        ls -lh target/release/bundle/deb/*.deb
        if [ -d "target/release/bundle/appimage" ]; then
          echo "📦 AppImage:"
          ls -lh target/release/bundle/appimage/*.AppImage || true
        fi