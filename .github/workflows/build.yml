name: Build Multi-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-path: target/release/bundle/nsis/*.exe
            artifact-name: skybal-windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle-path: target/release/bundle/deb/*.deb
            artifact-name: skybal-linux

    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Install system dependencies for Ubuntu
    - name: Install dependencies (Ubuntu)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libssl-dev \
          pkg-config

    # Install sccache (cross-platform)
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.4

    # Set up Rust
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: ${{ matrix.target }}

    # Configure sccache
    - name: Configure sccache
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    # Use rust-cache for Cargo dependencies
    - name: Set up Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.platform }}

    # Cache Tauri CLI
    - name: Cache Tauri CLI
      id: cache-tauri-cli
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-tauri*
        key: ${{ runner.os }}-tauri-cli-2.0

    # Install Tauri CLI
    - name: Install cargo-tauri
      if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
      run: cargo install tauri-cli --version "^2.0.0" --locked

    # Run tests
    - name: Run tests
      run: cargo test --workspace

    # Run clippy
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Build the app (no bundle for faster testing)
    - name: Build app
      run: cargo build --release

    # Bundle the application
    - name: Bundle application
      run: cargo tauri build

    # Upload Windows installer
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.bundle-path }}
        if-no-files-found: error

    # Print sccache stats
    - name: Print sccache stats
      shell: bash
      run: sccache --show-stats